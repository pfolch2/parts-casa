
<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordenem les síl·labes de la casa</title>

<style>
:root {
    --fons: #f4f6f8;
    --text: #17202a;
    --blau: #175cd3;
    --verd: #16794b;
    --vermell: #b42318;
    --vora: #c8d0d9;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 24px;
    font-family: Arial, Helvetica, sans-serif;
    background: var(--fons);
    color: var(--text);
    text-align: center;
}

h1 {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    margin: 0 0 10px;
}

.instruccions {
    font-size: 1.15rem;
    margin: 0 auto 24px;
    max-width: 720px;
    line-height: 1.5;
}

.targetes {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 22px;
    max-width: 1100px;
    margin: 0 auto;
}

.targeta-contenidor {
    perspective: 1000px;
}

.targeta {
    position: relative;
    width: 100%;
    min-height: 390px;
    border: 3px solid var(--vora);
    border-radius: 18px;
    background: white;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.55s;
    box-shadow: 0 4px 12px rgba(0,0,0,.08);
}

.targeta.girada {
    transform: rotateY(180deg);
}

.cara {
    position: absolute;
    inset: 0;
    padding: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 15px;
}

.davant { background: #fff; }

.darrere {
    transform: rotateY(180deg);
    background: #fff;
}

.icona-casa {
    font-size: 7rem;
    line-height: 1.3;
}

.nom-casa {
    font-size: 1.4rem;
    font-weight: bold;
}

.pista {
    font-size: 1rem;
    color: #475467;
}

.sillabes {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    min-height: 58px;
}

.sil·laba {
    border: 2px solid #98a2b3;
    border-radius: 10px;
    background: #f8fafc;
    padding: 12px 15px;
    min-width: 58px;
    font-size: 1.25rem;
    font-weight: bold;
    cursor: pointer;
    color: var(--text);
}

.sil·laba:focus-visible,
button:focus-visible,
.targeta:focus-visible {
    outline: 4px solid #fdb022;
    outline-offset: 3px;
}

.sil·laba.seleccionada {
    background: #dbeafe;
    border-color: var(--blau);
    opacity: 0.5;
    cursor: default;
}

.resposta {
    min-height: 44px;
    width: 100%;
    padding: 10px;
    border: 2px dashed #98a2b3;
    border-radius: 10px;
    font-size: 1.2rem;
    font-weight: bold;
    letter-spacing: 1px;
}

.botons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
}

button.accio {
    border: 0;
    border-radius: 10px;
    padding: 12px 17px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
}

.corregir {
    background: var(--blau);
    color: white;
}

.esborrar {
    background: #e4e7ec;
    color: #17202a;
}

.missatge {
    min-height: 28px;
    font-size: 1.05rem;
    font-weight: bold;
}

.correcte { color: var(--verd); }
.incorrecte { color: var(--vermell); }

.nota {
    margin-top: 22px;
    color: #475467;
    font-size: .95rem;
}

@media (max-width: 520px) {
    body { padding: 14px; }
    .targeta { min-height: 370px; }
}

@media (prefers-reduced-motion: reduce) {
    .targeta { transition: none; }
}
</style>
</head>

<body>

<h1>ORDENEM LES SÍL·LABES DE LA CASA!</h1>

<p class="instruccions">
1. GIRA UNA TARGETA PER VEURE LES SÍL·LABES.<br>
2. PREM LES SÍL·LABES EN L'ORDRE CORRECTE.<br>
3. PREM <strong>CORREGIR</strong> PER COMPROVAR LA RESPOSTA.
</p>

<main class="targetes" id="targetes"></main>

<p class="nota">
SI T'EQUIVOQUES, PREM «TORNAR A COMENÇAR» I PROVA-HO DE NOU.
</p>

<script>

// LLISTA DE LES 40 PARTS I ELEMENTS DE LA CASA

const partsCasa = [

    {nom:"CA-SA", sillabes:["CA","SA"], icona:"🏠", alt:"Casa"},
    {nom:"POR-TA", sillabes:["POR","TA"], icona:"🚪", alt:"Porta"},
    {nom:"FI-NES-TRA", sillabes:["FI","NES","TRA"], icona:"🪟", alt:"Finestra"},
    {nom:"TEU-LA-DA", sillabes:["TEU","LA","DA"], imatge:"https://www.independent.cat/imgMini/844/474/30926", alt:"Teulada"},
    {nom:"PA-RET", sillabes:["PA","RET"], icona:"🧱", alt:"Paret"},
    {nom:"SOS-TRE", sillabes:["SOS","TRE"], imatge:"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQyNeNAl68j8XTj4JuetcfmNFTyn-gI0NXjtQJXKJeMuUoeLxBq_qtdCmo&s=10", alt:"Sostre"},
    {nom:"TER-RA", sillabes:["TER","RA"], icona:"⬜", alt:"Terra"},
    {nom:"PAS-SA-DÍS", sillabes:["PAS","SA","DÍS"], icona:"🚶", alt:"Passadís"},
    {nom:"ES-CA-LA", sillabes:["ES","CA","LA"], icona:"🪜", alt:"Escala"},
    {nom:"BAL-CÓ", sillabes:["BAL","CÓ"], icona:"🌇", alt:"Balcó"},

    {nom:"TER-RAS-SA", sillabes:["TER","RAS","SA"], icona:"🌞", alt:"Terrassa"},
    {nom:"JAR-DÍ", sillabes:["JAR","DÍ"], icona:"🌳", alt:"Jardí"},
    {nom:"CU-I-NA", sillabes:["CU","I","NA"], icona:"🍳", alt:"Cuina"},
    {nom:"MEN-JA-DOR", sillabes:["MEN","JA","DOR"], icona:"🍽️", alt:"Menjador"},
    {nom:"DOR-MI-TO-RI", sillabes:["DOR","MI","TO","RI"], icona:"🛏️", alt:"Dormitori"},
    {nom:"BA-NY", sillabes:["BA","NY"], icona:"🛁", alt:"Bany"},
    {nom:"SA-LA", sillabes:["SA","LA"], icona:"🛋️", alt:"Sala"},
    {nom:"GA-RAT-GE", sillabes:["GA","RAT","GE"], icona:"🚗", alt:"Garatge"},
    {nom:"EN-TRA-DA", sillabes:["EN","TRA","DA"], icona:"🚪", alt:"Entrada"},
    {nom:"RE-BOST", sillabes:["RE","BOST"], icona:"📦", alt:"Rebost"},

    {nom:"ES-TU-DI", sillabes:["ES","TU","DI"], icona:"📚", alt:"Estudi"},
    {nom:"SA-FA-REIG", sillabes:["SA","FA","REIG"], icona:"🧺", alt:"Safareig"},
    {nom:"AR-MA-RI", sillabes:["AR","MA","RI"], icona:"🚪", alt:"Armari"},
    {nom:"TAU-LA", sillabes:["TAU","LA"], icona:"🪑", alt:"Taula"},
    {nom:"CA-DI-RA", sillabes:["CA","DI","RA"], icona:"🪑", alt:"Cadira"},
    {nom:"SO-FÀ", sillabes:["SO","FÀ"], icona:"🛋️", alt:"Sofà"},
    {nom:"LLIT", sillabes:["LLIT"], icona:"🛏️", alt:"Llit"},
    {nom:"LLUM", sillabes:["LLUM"], icona:"💡", alt:"Llum"},
    {nom:"MI-RALL", sillabes:["MI","RALL"], icona:"🪞", alt:"Mirall"},
    {nom:"COR-TI-NA", sillabes:["COR","TI","NA"], icona:"🪟", alt:"Cortina"},

    {nom:"CA-TI-FA", sillabes:["CA","TI","FA"], icona:"🟫", alt:"Catifa"},
    {nom:"NE-VE-RA", sillabes:["NE","VE","RA"], icona:"🧊", alt:"Nevera"},
    {nom:"FORN", sillabes:["FORN"], icona:"🔥", alt:"Forn"},
    {nom:"REN-TA-DO-RA", sillabes:["REN","TA","DO","RA"], icona:"🧺", alt:"Rentadora"},
    {nom:"DUT-XA", sillabes:["DUT","XA"], icona:"🚿", alt:"Dutxa"},
    {nom:"LA-VA-BO", sillabes:["LA","VA","BO"], icona:"🚰", alt:"Lavabo"},
    {nom:"VÀ-TER", sillabes:["VÀ","TER"], icona:"🚽", alt:"Vàter"},
    {nom:"PRE-STAT-GE", sillabes:["PRE","STAT","GE"], icona:"📚", alt:"Prestatge"},
    {nom:"XE-ME-NEI-A", sillabes:["XE","ME","NEI","A"], icona:"🔥", alt:"Xemeneia"},
    {nom:"HA-BI-TA-CI-Ó", sillabes:["HA","BI","TA","CI","Ó"], icona:"🛏️", alt:"Habitació"}

];

// BARREJA LES SÍL·LABES

function barreja(llista) {
    const copia = [...llista];

    for (let i = copia.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copia[i], copia[j]] = [copia[j], copia[i]];
    }

    if (copia.length > 1 && copia.every((s, i) => s === llista[i])) {
        copia.push(copia.shift());
    }

    return copia;
}

const contenidor = document.getElementById("targetes");

// CREA LES TARGETES

partsCasa.forEach((part) => {

    const correcte = part.sillabes.join("");
    const desordenades = barreja(part.sillabes);

    const envoltori = document.createElement("section");
    envoltori.className = "targeta-contenidor";

    envoltori.innerHTML = `
        <div class="targeta" tabindex="0" role="button"
             aria-label="Gira la targeta de ${part.alt}"
             aria-pressed="false">

            <div class="cara davant">
                <div class="icona-casa" aria-hidden="true">${part.icona}</div>
                <div class="nom-casa">QUINA PART DE LA CASA ÉS?</div>
                <div class="pista">PREM LA TARGETA PER GIRAR-LA</div>
            </div>

            <div class="cara darrere">
                <div class="nom-casa">ORDENA LES SÍL·LABES</div>
                <div class="sillabes"></div>
                <div class="resposta"></div>

                <div class="botons">
                    <button class="accio corregir" type="button">CORREGIR</button>
                    <button class="accio esborrar" type="button">TORNAR A COMENÇAR</button>
                </div>

                <div class="missatge" aria-live="polite"></div>
            </div>
        </div>
    `;

    const targeta = envoltori.querySelector(".targeta");
    const zonaSillabes = envoltori.querySelector(".sillabes");
    const resposta = envoltori.querySelector(".resposta");
    const missatge = envoltori.querySelector(".missatge");

    let triades = [];

    function actualitzaResposta() {
        resposta.textContent = triades.map(s => s.text).join(" · ");
    }

    function pintaSillabes() {
        zonaSillabes.innerHTML = "";

        desordenades.forEach((sillaba, i) => {
            const boto = document.createElement("button");

            boto.type = "button";
            boto.className = "sil·laba";
            boto.textContent = sillaba;

            boto.addEventListener("click", (event) => {
                event.stopPropagation();

                if (boto.disabled) return;

                triades.push({text: sillaba, id: i});

                boto.disabled = true;
                boto.classList.add("seleccionada");

                actualitzaResposta();

                missatge.textContent = "";
                missatge.className = "missatge";
            });

            zonaSillabes.appendChild(boto);
        });
    }

    function reinicia() {
        triades = [];
        actualitzaResposta();

        missatge.textContent = "";
        missatge.className = "missatge";

        pintaSillabes();
    }

    // GIRAR LA TARGETA

    targeta.addEventListener("click", (event) => {
        if (event.target.closest("button")) return;

        targeta.classList.toggle("girada");

        targeta.setAttribute(
            "aria-pressed",
            targeta.classList.contains("girada") ? "true" : "false"
        );
    });

    targeta.addEventListener("keydown", (event) => {
        if (
            (event.key === "Enter" || event.key === " ") &&
            !event.target.closest("button")
        ) {
            event.preventDefault();
            targeta.classList.toggle("girada");

            targeta.setAttribute(
                "aria-pressed",
                targeta.classList.contains("girada") ? "true" : "false"
            );
        }
    });

    // CORREGIR LA RESPOSTA D'AQUESTA TARGETA

    envoltori.querySelector(".corregir").addEventListener("click", (event) => {
        event.stopPropagation();

        const respostaUsuari = triades.map(s => s.text).join("");

        if (respostaUsuari === correcte) {
            missatge.textContent = "MOLT BÉ! RESPOSTA CORRECTA!";
            missatge.className = "missatge correcte";
        } else {
            missatge.textContent = "ENCARA NO. TORNA-HO A PROVAR!";
            missatge.className = "missatge incorrecte";
        }
    });

    // TORNAR A COMENÇAR NOMÉS AQUESTA TARGETA

    envoltori.querySelector(".esborrar").addEventListener("click", (event) => {
        event.stopPropagation();
        reinicia();
    });

    pintaSillabes();
    contenidor.appendChild(envoltori);

});

</script>

</body>
</html>
